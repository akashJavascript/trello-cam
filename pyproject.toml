[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-autocam"
version = "0.1.0"
description = "Trello cards with Onshape parts -> nested, CAM'd Fusion sheets -> WinCNC .tap files back on Trello"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pillow>=10.1",           # part labels on the sheet previews (labels.py; without it they go unlabelled)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
qr = ["segno>=1.5"]           # `autocam shop-qr`: the shaft list's QR code to print (cli.py)
photos = ["opencv-python-headless>=4.8", "numpy>=1.24"]   # the Offcuts tab finds corners and holes in photos (photo_find.py)

[project.scripts]
autocam = "autocam_service.cli:main"

# Two import roots: core/ (stdlib only, also loaded by the Fusion add-in) and service/.
[tool.setuptools.packages.find]
where = ["core", "service"]

[tool.setuptools.package-data]
autocam_service = ["panel/static/*"]   # the Onshape panel's page

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "service", "fusion/autocam_addin"]
addopts = "-ra"
