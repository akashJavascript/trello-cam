# FRC auto-CAM configuration (committed; NO secrets here: see .env.example).
#
# - All lengths are inches. Fusion's API is cm internally; conversion happens at the edge.
# - Values that are guesses are listed in [assumed]. Delete a line there once the value is confirmed.
# - Empty strings ("") are placeholders that a later milestone fills in.
# - `python -m autocam_service config-check` validates this file and lists both.
# - The Fusion add-in never reads this file. The service copies what a job needs into job.json.

schema = 1

[assumed]
"clamps.edges" = "decision 20: clamps on the two long edges only (left and right: the sheet's length runs front to back)"
"clamps.reach_in" = "decision 20: clamp reach onto the plate"
"clamps.clearance_in" = "decision 20: clearance added to the clamp reach"
"clamps.height_in" = "decision 20: clamp height above the plate"
"clamps.min_clear_above_stock_in" = "decision 20: template clearance height above stock top"
"machine.units" = "decision 20: programs post in inches"
"machine.air_test_gap_in" = "the raised program's highest point (clearance height + thickness + gap) must stay inside the Z travel"
"nest.reach_margin_in" = "plan: margin kept short of the 40 in reach"
"holes.drill_sizes_in.t12_eighth_alu" = "decision 7: drill sizes for the 1/8 in endmill"
"holes.drill_sizes_in.eighth_poly" = "decision 7: assumed the same as the aluminum 1/8 in"
"materials.al6061.use_mist" = "decision 20: mist on for aluminum"
"materials.al5052.use_mist" = "decision 20: mist on for aluminum"
"materials.pc_clear.use_mist" = "decision 20: mist off for polycarbonate"
"materials.pc_smoked.use_mist" = "decision 20: mist off for polycarbonate"
"onshape.base_url" = "enterprise accounts may use https://<company>.onshape.com"
"onshape.material_map" = "open question 8: the exact Onshape material names students use"
"onshape.yearly_cap_calls" = "plan: this service's share of the enterprise's 10,000 calls/year"
"onshape.monthly_soft_calls" = "plan: warn above this many calls in a month"
"onshape.budget_year_start" = "plan: when the enterprise's call year resets (MM-DD)"
"panel.onshape_calls_per_day" = "a guess: about 10 Part Studios and 20 part checks a day (2026-11-01: raised from 40 for the design checks)"
"panel.onshape_calls_per_year" = "a share of the enterprise's 10,000 calls a year, beside runs' 1500"
"costs.nest_efficiency" = "the user's figure: 10% under the first guess (0.8); check against real sheets"
"fusion.params.setup.wcs_origin_boxPoint" = "the team's manual value; check it lands bottom front-left in the nest preview (M1.3)"
"fusion.params.setup.stock_mode_value" = "fallback only; confirm the 'from solid' value if Setup.stockSolids fails"

[machine]
reach_y_in = 40.0          # ShopSabre 23: Y runs front to back, 40 in; the rest of the 48 in sheet hangs off the back
                           # (X runs across the bed, 30 in; the sheet's 24 in width goes across)
z_floor_in = 0.0           # no motion below this Z. Z0 = stock bottom. Must be >= 0.
units = "in"               # programs post in inches (G20)
spindle_rpm = 18000
spin_up_dwell_s = 4.0      # the post's G4 X4 after M3
park = "G53 P10"           # park position, same as the post's program end
z_touchoff = "spoilboard"
air_test_gap_in = 0.5      # an air test program runs this far above the top of the sheet
air_test_feed_ipm = 200.0  # ...outlines only, every feed move at this speed (rapids stay rapids)
air_test_auto = true       # the air test comes ticked on a sheet on an offcut or a piece added by hand, or with a
                           # part placed by hand (untick it under Options to skip it)

[sheet]
length_in = 48.0
width_in = 24.0

[nest]
edge_margin_in = 0.5       # margin on unclamped edges, including the zero-corner end
reach_margin_in = 0.5      # stay this far short of reach_y_in
part_spacing_in = 0.5      # more than 2 tool diameters: a solid strip between two parts' cuts holds their tabs
max_sheets_per_group = 4   # per material + thickness group in one job
rotation = "all"           # "all" | "none"
part_in_part = false
envelope_spacing_in = 6.0  # gap between envelopes while nesting (layout only)
short_qty = "defer_card"   # a card whose full qty doesn't fit is not cut this run
offcut_gap_in = 0.25       # a new nest on an offcut stays this far past the earlier cuts' part spacing (placement slack; 0.5 until 2026-11-04)
offcut_min_in = 6.0        # an offcut needs a free stretch this long (full width) to be kept or used
offcut_beside_min_in = 3.0 # room beside the parts cut is kept and filled when it's this big both ways
priority_by_size = true    # Fusion's Arrange priority: biggest parts very high, mid-size high (2026-11-04)
straight_max = 12          # a sheet with at most this many parts is also tried in straight rows; the better offcut is kept (0: never)
square_parts = true        # a part drawn off square in CAD is laid square in every Arrange (Fusion keeps the CAD angle, r098)
beside_cut_in = 0.25       # parts stay this far in from an edge next to earlier cuts (the region's edges keep part_spacing_in):
                           # beside a hole already cut, a part needs room for its cutter, not a strip for tabs (2026-11-06)
offcut_bed_gap_in = 0.0625 # offcut_gap_in for an offcut still clamped the way it was last cut, loaded the same way round:
                           # its zeros haven't moved; 1/16 in for a bumped clamp (2026-11-06). Off the bed: the machine
                           # screen's "I'm putting it back on the rack", another sheet Loaded, or the next day

[clamps]
edges = ["left", "right"]  # any of "left", "right" (the long edges), "front" (the end by you); the back overhangs
reach_in = 1.0
clearance_in = 0.25
height_in = 1.5
min_clear_above_stock_in = 2.0
in_fusion = true           # the strips as blocks (clamp height, on the plate) set as fixtures in each sheet's Fusion
                           # setup, so its simulation shows them (2026-11-04). The program check covers them either way

[pauses]
enabled = true
after_last_part = false    # the program end already retracts, stops the spindle and parks
mode = "tap_text"          # "tap_text" | "manual_nc" (only once the API is proven to create Manual NC)
resume_key = "ENTER"       # WinCNC: a bare G4 waits for ENTER (users guide 2.6 p. 93); confirm at the machine

[plate]
thickness_tol_in = 0.005
strict_inside_radius = true

[materials.al6061]
name = "6061"
family = "aluminum"
thicknesses_in = [0.0625, 0.125, 0.1875, 0.25]
use_mist = true
program_prefix = "6061"

[materials.al5052]
name = "5052"
family = "aluminum"
thicknesses_in = [0.0625, 0.125]
use_mist = true
program_prefix = "5052"

[materials.pc_clear]
name = "PC"
family = "polycarbonate"
color = "clear"
thicknesses_in = [0.0625, 0.125, 0.1875, 0.25]
use_mist = false
program_prefix = "PCclear"

[materials.pc_smoked]
name = "PC"
family = "polycarbonate"
color = "smoked"
thicknesses_in = [0.0625, 0.125, 0.1875, 0.25]
use_mist = false
program_prefix = "PCsmoked"

# SRPP (self-reinforced polypropylene), three kinds (the user, 2026-11-02): cut exactly like polycarbonate on the
# router (its family: same tools, templates and checks) and set to Polycarbonate in Onshape, which is close in weight.
# A card names the kind with a Material: line (Material: SRPP Twill); the panel writes it. Each kind is its own stock.
[materials.srpp_twill]          # WCP SRPP Twill, 24 x 48
name = "SRPP"
family = "polycarbonate"
color = "Twill"
thicknesses_in = [0.125, 0.1875, 0.25]
use_mist = false
program_prefix = "SRPPtwill"

[materials.srpp_maxcomposite]   # REV MAXComposite: sold 47 x 23 in, 0.1 and 0.2 in thick
name = "SRPP"
family = "polycarbonate"
color = "MAXComposite"
thicknesses_in = [0.125, 0.1875, 0.25]
use_mist = false
program_prefix = "SRPPmax"
sheet_length_in = 47.0          # its new sheets: nested, clamped and priced as 47 x 23 (the user, 2026-11-02)
sheet_width_in = 23.0

[materials.srpp_swyft]          # SWYFT Composite: sold 24 x 24 in (610 mm), 3 and 6 mm thick
name = "SRPP"
family = "polycarbonate"
color = "SWYFT"
thicknesses_in = [0.125, 0.1875, 0.25]
use_mist = false
program_prefix = "SRPPswyft"
sheet_length_in = 24.0          # its new sheets: 24 x 24 (610 mm square)
sheet_width_in = 24.0

# Tools are identified by GUID only. number/diameter/flute are checked against the pinned
# library, never used to pick a tool. cutter_label is what the sheet card tells the operator to load.
# GUIDs change when a library is re-saved or copied, so config, the pinned library file and the
# templates must all come from the same library (switched to the team's March 2026 library on 2026-10-01).
[tools.t1_4mm_alu]
guid = "e5dd75b2-ea23-4767-b10b-756a9444cc2e"
number = 1
diameter_in = 0.15748
flute_in = 0.4724
min_inside_radius_in = 0.0787
family = "aluminum"
cutter_label = "4 mm O-flute ALU"

[tools.t1_4mm_poly]
guid = "b4521723-7c35-4121-b376-50f3db7bc3a0"
number = 1
diameter_in = 0.15748
flute_in = 0.4724                # WCP-1513: 12 mm cut length (the user's bits, 2026-11-03; was 18 mm, a guess)
min_inside_radius_in = 0.0787
family = "polycarbonate"
cutter_label = "4 mm WCP POLY"

[tools.t12_eighth_alu]
guid = "dc1f12bd-dbcc-4d53-9ad2-9a65b2ed6fb5"
number = 12
diameter_in = 0.125
flute_in = 0.4724
min_inside_radius_in = 0.0625
family = "aluminum"
cutter_label = "1/8 in ALU"

[tools.eighth_poly]
guid = "7a26b9db-1b3f-4695-8c8e-3439cc04258a"   # "1/8 polycarbonate" (also T12: the post can't tell it from the alu 1/8)
number = 12
diameter_in = 0.125
flute_in = 0.4724
min_inside_radius_in = 0.0625
family = "polycarbonate"
cutter_label = "1/8 in WCP POLY"   # WCP-1517

[tooling.aluminum]
default = "t1_4mm_alu"
small_features = "t12_eighth_alu"
split = true               # small holes (an 8-32's 0.136) and tight cutouts in a short 1/8 in program run first, the
                           # rest on the 4 mm, outlines last (the user, 2026-11-01); false: the whole sheet on the 1/8

[tooling.polycarbonate]
default = "t1_4mm_poly"
small_features = "eighth_poly"
split = true

[holes]
drill_tol_in = 0.002       # drill sizes are an exact list, +/- this
bore_min_in = 0.197        # 5 mm
bore_min_tol_in = 0.002
bore_max_in = 1.5          # inclusive; larger round holes go to [inner]
bearing_sizes_in = [1.125, 0.875]
bearing_tol_in = 0.010
bearing_stock_in = 0.0     # press-fit tuning: radial stock the [bearing] op leaves. + makes bearing holes tighter,
                           # - looser (0.0005 = 0.001 on the diameter); at most 0.01 either way; 0 = as modeled

[holes.drill_sizes_in]
t1_4mm_alu = [0.156, 0.159]
t1_4mm_poly = [0.156, 0.159]
t12_eighth_alu = [0.125, 0.136]
eighth_poly = [0.125, 0.136]

[cam]
op_tags = ["pocket", "pocketfinish", "drill", "bore", "bearing", "inner", "outer"]   # template op order: pockets
                                # first, so a hole in a pocket floor is cut after the pocket is cleared

# One template per material family and tool. Files are exported from Fusion's template library.
[templates.alu_4mm]
family = "aluminum"
tool = "t1_4mm_alu"
file = "fusion/templates/alu_4mm.f3dhsm-template"

[templates.alu_eighth]
family = "aluminum"
tool = "t12_eighth_alu"
file = "fusion/templates/alu_eighth.f3dhsm-template"

[templates.poly_4mm]
family = "polycarbonate"
tool = "t1_4mm_poly"
file = "fusion/templates/poly_4mm.f3dhsm-template"

[templates.poly_eighth]
family = "polycarbonate"
tool = "eighth_poly"
file = "fusion/templates/poly_eighth.f3dhsm-template"

[labels]
smoked = "Smoked"
tool_eighth = "Tool 1/8"
rush = "Rush"              # one part needed now: nested at once, on its own (an offcut or a new sheet)
face = "Face"              # a clean top: skimmed before the sheet is cut ([face])
spare = "Spare"            # spares for the spares box (the panel and the phone's Send spares put it on): they get only
                           # the room the robot parts leave, and the sheet card marks them
cad_changed = "CAD changed"   # put on by AutoCAM: the part changed in Onshape after it was CAM'd (its card has a box
                              # to cut it as it was anyway); cleared once that's ticked or the part is nested again

[face]                     # the Face label: a FACE program per sheet, run first, skims those parts' tops only
depth_in = 0.005           # how much comes off the top (the user's default, 2026-11-01); at most 0.02
guid = "4147915e-c136-481d-bcaa-213e9c8e6623"   # "6mm 3 flute Alu" (T2; the user's choice, 2026-11-01)
number = 2
diameter_in = 0.23622
flute_in = 0.70866
cutter_label = "6 mm 3-flute ALU"
template = "fusion/templates/face_6mm.f3dhsm-template"   # one [face] op with that tool (make_face.py)

[scribe]                   # a bent part's bend lines scribed on its top, if its card asks (Scribe: endmill or chamfer;
                           # the panel's "Scribe the bend lines"); off unless asked (the user's choice, 2026-11-01)
depth_in = 0.012           # with the sheet's own endmill, in the sheet's program (a line as wide as the cutter);
                           # the user's 10 to 15 thou (2026-11-01). At most 0.02. Below a faced top, if it's faced
chamfer_depth_in = 0.012   # with the chamfer mill, in a SCRIBE program run before the sheet's (a line 2x this wide)
chamfer_guid = "915d08db-80ad-44e2-8fd5-6b9ed2129f59"   # "6mm 45 deg chamfer" (T16) in the pinned library
chamfer_number = 16
chamfer_diameter_in = 0.23622
chamfer_flute_in = 0.70866
chamfer_label = "6 mm 45 deg chamfer mill"

[onshape]
base_url = "https://cad.onshape.com"
calls_per_part_estimate = 4    # translation + status checks + download; parts after the first usually need 3
per_run_max_calls = 60          # was 15 for the first supervised runs; raised 2026-10-04 (ledger checked)
monthly_soft_calls = 150
yearly_cap_calls = 3000          # runs' share of the enterprise's 10,000 a year (was 1500; raised 2026-11-01, the user)
budget_year_start = "01-01"
poll_first_s = 15.0              # STEP export status checks: 15, 60, 120 and 180 s after it started (the first was
                                 # at 5 s until 2026-11-01: exports took about 2.3 checks each; the user's choice),
poll_factor = 3.0                # then the next run checks once (it remembers the export)
poll_max_s = 60.0
poll_max_count = 4
retry_after_max_wait_s = 60.0   # a longer Retry-After stops the run instead of sleeping

[onshape.material_map]
"Aluminum - 6061" = "al6061"
"Aluminum - 5052" = "al5052"
"Polycarbonate" = "pc_clear"    # the Smoked label turns this into pc_smoked

[trello]
board_id = "6ac00269a17b9c9e14cca924"   # https://trello.com/b/fsuTYbO3/5940-autocam
poll_interval_s = 15             # how often the service reads the board (was 60; the user asked for faster, 2026-11-01)
attachment_limit_mb = 10        # Trello Free plan limit
job_timeout_s = 3600            # service gives up waiting for a Fusion job after this
start_delay_s = 60              # a run starts this long after the last card arrived in Ready for CAM (was 120)
nest_checklist = "Nest"         # part cards: one item, ticked by default; untick it and runs skip the card
nest_item = "Nest this part"
options_checklist = "Options"   # sheet cards, both unticked to start; the service applies them within a minute
no_stop_item = "Cut the whole sheet without stopping"   # the program without the stop after each part
air_test_item = "Add an air test program (cuts nothing)"  # the program raised machine.air_test_gap_in above the sheet
offcut_checklist = "Offcut"     # sheet cards with room left: ticked = when it's cut, keep the rest for the next run
offcut_item = "Keep the rest of the sheet for the next run"
tabs_checklist = "Tabs"         # part cards: ticked = its outline gets tabs ([tabs])
tabs_item = "Hold it in with tabs"
stock_checklist = "Stock"       # sheet cards on an offcut: tick the item if the offcut can't be found
not_found_item = "The offcut isn't on the rack"
cut_away_item = "Something's already cut where this program goes"   # ticked: like not_found, but the offcut stays
renest_item = "Re-nest it on other stock (a new run and a new review)"   # offered when no other offcut fits
new_sheet_item = "Cut it on a new sheet (the same program)"
checklist_name = "Review"                  # all ticked before a sheet may sit in Ready to cut
checklist = ["Simulated it in Fusion", "Parts and quantities look right"]
machine_checklist_name = "At the machine"  # for the operator; not checked by the service
machine_checklist = ["Stock and cutter match the card", "Clamps placed as in the preview", "Tool measured on the fixed tool setter (Z0 = spoilboard)"]

[trello.lists]                  # list IDs (made by `autocam trello-setup`, 2026-10-02)
inbox = "6ac0026a66e818f7107c352d"
ready_for_cam = "6ac0026a2ee6c0eeb685602d"
needs_fixing = "6ac0026bd34a0d025a7f0a66"
nested = "6ac0026b4d41d11e7f2a3ac3"
sheet_review = "6ac0026b744b6964194f359f"
ready_to_cut = "6ac0026c4442c15e984f34a9"
cut = "6ac0026c1d0c81e2cdf15ac0"
offcuts = "6ac0b00fbc521a091bedebae"
control = "6ac0026cfe5942cefb71f3b9"

[trello.targets]                # where automation moves cards; "ready_to_cut" is never allowed
part_nested = "nested"
part_rejected = "needs_fixing"
part_deferred = "ready_for_cam"
part_cut = "cut"                # a part card follows its sheet(s) to Cut
sheet_created = "sheet_review"
checklist_return = "sheet_review"

[trello.cards]
system = "6ac0026e5a5b72b5f5331c88"

[fusion]
post_description = "ShopSabre with automatic mist"
post_file = "fusion/posts/shopsabre_automatic_mist.cps"
post_sha256 = "9bfcc6beb01b5123fc86495ce1907b7de72cccd5167638ca568591129de9741f"
tool_library = "fusion/tools/5940_Tool_Library.tools"
job_timeout_s = 1800
max_attempts = 2

[fusion.post_properties]        # every post property, set explicitly on every post; useMist comes from the material
showSequenceNumbers = "false"
sequenceNumberStart = 10
sequenceNumberIncrement = 1
separateWordsWithSpace = true
writeMachine = false
writeTools = false
useToolCall = false
useTappingCycle = false
rotaryTableAxis = "none"
useCoolant = false
useXYZFeeds = "standard"
safePositionMethod = "G53"

# Fusion CAM parameter names. Confirmed 2026-10-01 by dump_params on a manual job (Fusion 2705.1.15)
# unless [assumed] says otherwise.
[fusion.params.setup]
wcs_origin_mode = "'stockPoint'"        # "Stock box point"
wcs_origin_boxPoint = "'bottom 1'"
stock_mode = "job_stockMode"            # fallback if Setup.stockSolids doesn't work
stock_mode_value = "'solid'"
stock_solid = "job_stockSolid"

[fusion.params.drill]
hole_mode = "holeMode"
hole_mode_value = "'selection-faces'"
faces = "holeFaces"

[fusion.params.bore]
hole_mode = "holeMode"
hole_mode_value = "'selection-faces'"
faces = "circularFaces"

[fusion.params.selections]
contour = "contours"
pocket = "pockets"                      # 2D Adaptive's "Pocket Selections" (dump_params, 2026-10-31)
face = "pockets"                        # the face template's op is a 2D Adaptive too

[fusion.params.tabs]                    # M6
enabled = "group_tabs"
positioning = "tabPositioning"
manual_positions = "tabPositions"
width = "tabWidth"
height = "tabHeight"
distance = "tabDistance"
per_contour = "tabsPerContour"

[tapguard]
allowed_g = [0, 1, 2, 3, 4, 20, 53, 80, 81, 90]
allowed_m = [3, 5, 11, 12]     # WinCNC has no M0 (the stop is a bare G4)
clamp_margin_in = 0.25

[fusion_team]                   # where each job's Fusion document is saved (searched in every hub you can see)
project = "5940 BREAD"          # in Brock's hub
folder = "AutoCAM test"         # must exist; nested folders as "a/b"

[status]                        # the System card's description (M5)
update_every_s = 120            # rewritten this often while the service runs, and whenever something changes
fusion_stale_after_s = 300      # no heartbeat from the add-in for this long: Fusion or the add-in isn't running
season_start = "09-01"          # the stock tally counts sheets cut since this day (MM-DD) each year

[fit]                           # a "Fit: 1.125 hole" or "Fit: outline" line on a part card: that feature is cut
                                # tight, and the sheet gets lap programs that each take a little more off, run one
                                # by one until it fits (the user's choice, 2026-11-01). The part is always tabbed.
enabled = true
start_in = 0.003                # radial stock the sheet's program leaves on it (+: a hole smaller, an outline bigger)
step_in = 0.001                 # each lap takes this much more off (radial): 0.002 on a hole's diameter
laps = 4                        # so the laps leave 0.002, 0.001, 0 and -0.001; once a fit is ticked on a sheet
                                # card, the next one starts two steps above where it fit
outlines_last = true            # a hole fit: the part's outline isn't in the sheet's program, so the part stays
                                # solid in the sheet while the hole is lapped; the sheet's OUTLINES program cuts
                                # it out once the hole fits (the user's ask, 2026-11-04). false: cut out first,
                                # lapped on its tabs

[hand_cuts]                     # parts cut out of offcuts outside AutoCAM. A "Cut by hand:" line on the offcut's
                                # card always works; this lets the card carry the program that cut it instead
programs = true                 # read .tap files attached to offcut cards, with a "Zeroed at:" line (the user's
                                # choice, 2026-11-01: optional, beside the typed line)
cutter_in = 0.25                # the cutter's diameter when the card has no "Cutter:" line (covers 4 mm, 1/8, 6 mm)
place_programs = true           # a card in Ready for CAM with someone's own .tap (no part): AutoCAM picks the spot,
                                # moves the program there and puts it on a card in Sheet review (option 3, 2026-11-01)
place_spare_across_in = 0.05    # ...its footprint this far inside the nest region across; the region already clears
                                # the clamps by clamps.clearance_in. Was half the part spacing (0.25 in) like along:
                                # the user's 21.3 in wide part_509.tap didn't fit 21.0 (2026-11-03); now 21.4 across

[tabs]                          # tabs on the outlines of parts whose "Hold it in with tabs" box is ticked
default = true                  # the box starts ticked on new part cards (the user's choice, 2026-10-03)
distance_in = 2.5               # about one tab per this much contour (outline or cutout); their shape
                                # (triangular) is the template's: the API can't set the shape
width_in = 0.3                  # 0: the template's (one cutter, 0.157 in). The user's 0.3 in works with every tab on
                                # straight edges (r060, r063, r064, r067). Tabs on curves crashed Fusion at either width
                                # (r059, r061, r062, r065), so wide_max_tier, the per-setup rule and free_max_in apply:
                                # on since 2026-11-02 (r067: tsize1's plates, 6 small cutouts cut free, fine)
height_in = 0.0394              # above the bottom: 1 mm, what the template had (0 for either: the template's)
wide_max_tier = 0               # tabs wider than the cutter go only where the cutter's whole climb over them is on one
                                # straight edge (tabs.place_tabs tier 0); a contour without room for its tabs gets the
                                # template's width. A wide tab whose ramp ran into a corner, fillet or curve crashed
                                # Fusion (tsize1, r054, r059); with every one on room for its ramp it didn't (r060)
free_max_in = 2.0               # beside 0.3 in tabs, a tabbed cutout with no straight edge for its tabs (a round hole
                                # cut as a cutout, a small rounded slot) and at most this across is cut free, no tabs,
                                # so the rest of the sheet keeps 0.3 in (the user's pick, 2026-11-02; the sheet card
                                # says so). Bigger ones, fitted slugs and curvy outlines keep that sheet at 0.157 in
min_per_contour = 2             # every tabbed outline and cutout gets at least this many (fewer only if they
max_per_contour = 6             # don't fit: a tiny cutout gets none)
at_points = true                # placed on straight edges clear of corners where possible (tabs.place_tabs);
                                # false: Fusion spreads them evenly

[panel]                         # the Onshape panel ("Send to AutoCAM", service/autocam_service/panel; docs/panel.md):
                                # a page in a Part Studio's right panel that makes part cards (Phase 1, 2026-11-01)
enabled = true
port = 8790                     # served on 127.0.0.1 only; the tunnel below makes it public_url. Not 8770: the
                                # LoRa range tester's walk page uses 8770-8772 on this laptop (moved 2026-11-02)
public_url = "https://autocam.team5940.org"
tunnel_dir = "C:/dev/autocam-tunnel"   # cloudflared.exe + config.yml + the tunnel's credentials (not in the repo);
                                # the service starts the tunnel and keeps it running ("" = it doesn't)
onshape_calls_per_day = 120     # (60 until 2026-11-01) the panel's own Onshape calls (parts lists, assembly counts, part checks, materials),
onshape_calls_per_year = 1500   # counted apart from runs' yearly_cap_calls; both are shares of the enterprise's 10,000
parts_cache_s = 600             # a Part Studio's parts list is read again after this long (or on Refresh)
assembly_cache_s = 1800         # the document's assemblies, for "how many does the robot use"
max_assemblies = 2              # quantities are counted in at most this many assemblies of the document (was 4)
board_cache_s = 10              # Trello lists read for each part's status (shared by every open panel)
sends_per_minute = 20
change_check_hours = 12         # sheets in Sheet review are compared with Onshape this often (one call per document
                                # state; Ready to cut sheets once each, when they get there)
webhooks = true                 # Onshape webhooks say what changed, within minutes: one per document with parts on an
                                # open sheet (a company-wide one is refused for model changes). Needs
                                # AUTOCAM_WEBHOOK_SECRET in .env
webhook_fallback_hours = 72     # with the webhook working, the check above happens only this often
assembly_check_minutes = 60     # assemblies AutoCAM watches (panel/assemblies.py: ones with shafts or bought parts on the
                                # shop's lists, or with cards for parts from another document's saved version) are read
                                # again (one call) after Onshape says they changed, at most this often; with no change
                                # reported, every change_check_hours (webhook_fallback_hours with a working webhook)
pictures = true                 # a picture of each part (Onshape's shaded view, one call each) on its card
auto_refresh_s = 15             # an open panel re-reads the statuses this often by itself (Trello only, never Onshape;
                                # it stops after 30 min with nobody using it). 0: only on Refresh
check_every_s = 30              # the before-cut check's loop: Trello reads; Onshape only when a check is due
change_quiet_s = 120            # an Onshape-reported change is checked once nobody has edited that tab this long
company_id = "652459d6412ce911b57afb73"   # Team 5940 BREAD's Onshape enterprise
team_usage_hours = 168          # the whole team's Onshape API count on the System card: one call a week (0: off)
shop_signin = "slack"           # the phone page (/shop): Sign in with Slack (panel/signin.py, docs/panel.md) once
                                # AUTOCAM_SLACK_CLIENT_ID, _SECRET and _TEAM_ID are in .env; "" = only the key link
shop_session_days = 60          # a signed-in phone stays signed in this long after it was last used
shop_old_link_days = 7          # the old key link keeps working this long after the first Slack sign-in
machine = true                  # the operator's screen on the ShopSabre's PC (/machine?key=..., its own key, no
                                # sign-in: `autocam machine-link` prints the link; machine.py, docs/machine.md)

[shafts]                        # the shop's shaft list (service/autocam_service/shafts.py, docs/shafts.md; 2026-11-02):
                                # library shafts in an assembly are sent from the Onshape panel with its plates and made
                                # from the phone page at <public_url>/shop (one item per shaft: Start, Done; no Trello)
enabled = true
library_document = "dee14b205b4629c493a3df74"   # the team's common parts library
tap = "10-32"                   # every shaft end gets this unless the sender picks another (1/4-20 is rare)
groove_depth_in = 0.020         # per side, every snap-ring groove (the user, 2026-11-02)
keep_done_days = 14             # done shafts drop off the list after this long

# The library's shaft tabs (element id -> stock). length_in: the default configuration's length, for a part left in
# it. "round" picks round bar by the part's OD (3/8 or 1/2); any other OD is turned from the next size up. Spline XL,
# Hex Spacer, the spline spacers and "3d printed standoff" are printed, so they aren't here.
[shafts.tabs.74fa9fa49ead33d7ba3d5ae0]   # Hex Shaft
stock = "1/2 hex"
length_in = 1.0
[shafts.tabs.33e281a702f193825b86827f]   # 3/8 Hex shaft
stock = "3/8 hex"
length_in = 1.0
[shafts.tabs.8c1ad05ff19d9d749c567410]   # 3/8 hex lite (a 0.159 hole through it)
stock = "3/8 hex lite"
length_in = 1.0
[shafts.tabs.ac38d53cc6fec9e9cc926402]   # Standoff (3/8 round; OD 0.5 is 1/2 round)
stock = "round"
length_in = 1.0
od_in = 0.375

[parts]                         # the shop's bought-parts list (service/autocam_service/bought.py, docs/bought-parts.md;
                                # 2026-11-02): an assembly's bought parts are sent from the Onshape panel and checked off
                                # on the phone page's Parts tab: In the bin (the team has it) or Order. Screws and nuts
                                # aren't on it
enabled = true
order_sheet_url = ""            # empty on purpose: the team's sheet link is AUTOCAM_ORDER_SHEET_URL in the laptop's .env
                                # (the repo is public; the sheet has students' names). Order opens it in a new tab and
                                # copies the part's name. AutoCAM never writes to it. No link anywhere: no Order button
keep_days = 14                  # parts put in the bin drop off the list after this long

