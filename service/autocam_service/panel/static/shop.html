<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fdf9f6">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/shop.css">
</head>
<body>
<header class="head">
  <button class="back" type="button" id="back" aria-label="Back to Plates" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="logo" id="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 15c2-6 4 2 6-4s3 3 4 1"/></svg></span>
  <span class="title" id="title">Shop</span>
  <div class="tabs" id="tabs" role="group" aria-label="List" hidden>
    <button type="button" data-tab="shafts" aria-pressed="true">Shafts</button>
    <button type="button" data-tab="parts" aria-pressed="false">Parts</button>
    <button type="button" data-tab="plates" aria-pressed="false">Plates</button>
    <button type="button" data-tab="prints" aria-pressed="false">Prints</button>
    <button type="button" data-tab="offcuts" aria-pressed="false">Offcuts</button>
  </div>
  <button class="me" type="button" id="me" hidden></button>
</header>
<main class="body" id="list" aria-live="polite"></main>
<div class="foot" id="foot" hidden></div>
<div class="sheet" id="picker" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/static/offcuts.js"></script>
<script src="/static/shop.js"></script>
</body>
</html>
